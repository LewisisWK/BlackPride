<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ad.size" content="width=300,height=600">
<title>Lilly – KV2 300x600</title>
<style>
  html,body{margin:0;height:100%;background:#3a3a3a;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;}

  /* ---- 300x600 banner stage ---- */
  #banner{
    position:relative;
    width:300px;height:600px;
    background:#ffffff;
    overflow:hidden;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  /* headline (Asset 1) – black, top, centred */
  #headline{
    position:absolute;top:32px;left:50%;
    transform:translateX(-50%);
    width:220px;height:auto;
    z-index:1;
  }

  /* key visual (portrait) – sits below headline, above white bg */
  #kv{
    position:absolute;top:182px;left:0;
    width:300px;height:299px;
    object-fit:cover;object-position:center top;
    z-index:1;display:block;
  }

  /* red panel (Asset 4 colour) – wipes down to reveal, then wipes back up.
     Anchored to the bottom; its height is animated. The logo lock-up is
     vertically centred inside it, so it glides down/up with the panel. */
  #red{
    position:absolute;left:0;bottom:0;
    width:300px;height:600px;
    background:#e1251b;
    z-index:2;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    animation:reveal 8s infinite;
    will-change:height;
  }

  #red .erfahren{width:178px;height:auto;display:block;margin-bottom:14px;}
  #red .lilly{width:116px;height:auto;display:block;}

  @keyframes reveal{
    /* all-red hold */
    0%   { height:600px; animation-timing-function:linear; }
    3%   { height:600px; animation-timing-function:cubic-bezier(.45,0,.20,1); }
    /* reveal: panel shrinks to bottom bar, exposing headline + portrait */
    22%  { height:118.65px; animation-timing-function:linear; }
    /* hold on full composition */
    75%  { height:118.65px; animation-timing-function:cubic-bezier(.60,0,.30,1); }
    /* cover: panel grows back up over everything */
    83%  { height:600px; animation-timing-function:linear; }
    /* all-red hold to loop point */
    100% { height:600px; }
  }

  @media (prefers-reduced-motion:reduce){
    #red{animation-duration:8s;}
  }
</style>
</head>
